# Generate the Xcode project with:  xcodegen generate   (brew install xcodegen)
name: TypinkPad
options:
  bundleIdPrefix: app.typink
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  TypinkPadCore:
    path: .
targets:
  TypinkPad:
    type: application
    platform: iOS
    sources:
      - path: Sources/TypinkPad
      # The app icon and accent colour (generated by `pnpm icon`) and the privacy manifest.
      - path: Resources
    # DEVELOPMENT_TEAM comes from Config/Signing.local.xcconfig, never from this file.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    # A shared scheme, for command-line archives (scripts/release-ipad.sh).
    scheme: {}
    dependencies:
      - package: TypinkPadCore
    info:
      path: Sources/TypinkPad/Info.plist
      properties:
        CFBundleDisplayName: Typink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Typink connects to the Typink app on your Mac over your local network to show your notes and send your drawings.
        NSBonjourServices:
          - _typink._tcp
        NSCameraUsageDescription: Typink uses the camera to scan the pairing code on your Mac and to take photos for your notes.
        # Only Apple's own networking, no encryption of Typink's own: skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # typink://pair?… links (the Mac's pairing QR code) open the app, so the Camera app can pair too.
        CFBundleURLTypes:
          - CFBundleURLName: app.typink.pad
            CFBundleURLSchemes:
              - typink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.typink.pad
        TARGETED_DEVICE_FAMILY: "2"
        # scripts/bump-version.mts keeps both in step with the Mac app.
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "1"
        # Swift 5 language mode: Apple frameworks still have rough concurrency annotations.
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
